name: Robot Sorteos Florida

on:
  schedule:
    - cron: '50 17,2 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Ejecutar Scraper (fl-lotto)
        run: |
          npx fl-lotto -g p3 > p3_output.txt
          npx fl-lotto -g p4 > p4_output.txt
          cat p3_output.txt
          cat p4_output.txt

      - name: Guardar cambios (Commit)
        run: |
          git config --global user.name 'Robot Florida'
          git config --global user.email 'robot@github.com'
          git add .
          git commit -m "Actualizacion automatica" || exit 0
          git push
